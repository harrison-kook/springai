<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Knowledge (RAG)</title>
    <style>
        :root {
            --bg: #f4f1ea;
            --panel: #ffffff;
            --border: #e2ddd0;
            --accent: #2f6f4f;
            --text: #2a2a26;
            --muted: #8a8574;
            --error: #842029;
            --error-bg: #f8d7da;
            --success: #1c5c33;
            --success-bg: #e3f1e6;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 32px 16px;
        }

        main {
            width: 100%;
            max-width: 640px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        h1 {
            font-size: 20px;
            margin: 0 0 4px;
        }

        p.lead {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
        }

        section.card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
        }

        section.card h2 {
            font-size: 16px;
            margin: 0 0 4px;
        }

        section.card p.hint {
            margin: 0 0 16px;
            font-size: 13px;
            color: var(--muted);
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin: 12px 0 6px;
        }

        .tabs {
            display: flex;
            gap: 16px;
            margin-top: 4px;
        }

        .tabs label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 400;
            font-size: 13px;
            margin: 0;
        }

        input[type="file"] {
            width: 100%;
            padding: 8px 0;
            font-size: 13px;
        }

        .required {
            color: var(--error);
            margin-right: 2px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
        }

        button {
            margin-top: 16px;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: var(--accent);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: default;
        }

        button .spinner {
            display: none;
            width: 13px;
            height: 13px;
            margin-right: 6px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-top-color: #fff;
            border-radius: 50%;
            vertical-align: -2px;
            animation: spin 0.7s linear infinite;
        }

        button.loading .spinner {
            display: inline-block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .result {
            margin-top: 14px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-word;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result.success {
            background: var(--success-bg);
            color: var(--success);
        }

        .result.error {
            background: var(--error-bg);
            color: var(--error);
        }

        .chunk {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            margin-top: 10px;
        }

        .chunk .score {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
<main>
    <div>
        <h1>Knowledge (RAG)</h1>
        <p class="lead">문서를 등록하면 pgvector에 임베딩되어 저장되고, 채팅에서 관련 내용이 자동으로 참고됩니다.</p>
    </div>

    <section class="card">
        <h2>문서 등록</h2>
        <p class="hint">등록한 문서는 청크로 나뉘어 임베딩된 뒤 저장됩니다.</p>

        <div class="tabs">
            <label><input type="radio" name="index-mode" value="text" checked> 텍스트 직접 입력</label>
            <label><input type="radio" name="index-mode" value="file"> 파일 업로드 (pdf, xlsx, docx, md)</label>
        </div>

        <form id="index-form">
            <label for="index-title"><span class="required">*</span>제목</label>
            <input type="text" id="index-title" placeholder="예: 회사 휴가 정책" required>

            <div id="index-text-fields">
                <label for="index-content">내용</label>
                <textarea id="index-content" rows="6" placeholder="문서 본문을 입력하세요."></textarea>
            </div>

            <div id="index-file-fields" hidden>
                <label for="index-file">파일</label>
                <input type="file" id="index-file" accept=".pdf,.xlsx,.docx,.md">
            </div>

            <button type="submit" id="index-submit"><span class="spinner"></span><span class="label">등록</span></button>
        </form>
        <div id="index-result" class="result"></div>
    </section>

    <section class="card">
        <h2>검색</h2>
        <p class="hint">등록된 문서 중 질의와 유사한 청크를 검색합니다. (채팅과 별개로 검색만 확인하는 용도)</p>
        <form id="search-form">
            <label for="search-query">질의</label>
            <input type="text" id="search-query" placeholder="예: 휴가는 며칠 쓸 수 있어?" required>

            <button type="submit">검색</button>
        </form>
        <div id="search-result" class="result"></div>
        <div id="search-chunks"></div>
    </section>
</main>
<script>
    function showResult(el, type, text) {
        el.textContent = text;
        el.className = 'result show ' + type;
    }

    const textFields = document.getElementById('index-text-fields');
    const fileFields = document.getElementById('index-file-fields');
    const contentInput = document.getElementById('index-content');
    const fileInput = document.getElementById('index-file');

    document.querySelectorAll('input[name="index-mode"]').forEach(function (radio) {
        radio.addEventListener('change', function () {
            const isFileMode = radio.value === 'file' && radio.checked;
            if (radio.checked) {
                textFields.hidden = isFileMode;
                fileFields.hidden = !isFileMode;
                contentInput.required = !isFileMode;
                fileInput.required = isFileMode;
            }
        });
    });

    const indexSubmitButton = document.getElementById('index-submit');

    function setLoading(button, loading) {
        button.disabled = loading;
        button.classList.toggle('loading', loading);
        button.querySelector('.label').textContent = loading ? '등록 중...' : '등록';
    }

    document.getElementById('index-form').addEventListener('submit', async function (event) {
        event.preventDefault();
        const resultEl = document.getElementById('index-result');
        const title = document.getElementById('index-title').value.trim();
        const mode = document.querySelector('input[name="index-mode"]:checked').value;

        setLoading(indexSubmitButton, true);
        try {
            let response;
            if (mode === 'file') {
                const file = fileInput.files[0];
                if (!file) {
                    showResult(resultEl, 'error', '파일을 선택해주세요.');
                    return;
                }
                const formData = new FormData();
                formData.append('title', title);
                formData.append('file', file);
                response = await fetch('/api/knowledge/documents/file', {
                    method: 'POST',
                    body: formData
                });
            } else {
                const content = contentInput.value.trim();
                response = await fetch('/api/knowledge/documents', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: title, content: content })
                });
            }

            if (response.status === 201) {
                const data = await response.json();
                showResult(resultEl, 'success', '등록되었습니다. (documentId: ' + data.documentId + ')');
            } else if (response.status === 400) {
                showResult(resultEl, 'error', mode === 'file'
                        ? '제목과 파일(pdf, xlsx, docx, md)을 확인해주세요.'
                        : '제목과 내용을 모두 입력해주세요.');
            } else {
                showResult(resultEl, 'error', '등록에 실패했습니다. (HTTP ' + response.status + ')');
            }
        } catch (error) {
            showResult(resultEl, 'error', error.message);
        } finally {
            setLoading(indexSubmitButton, false);
        }
    });

    document.getElementById('search-form').addEventListener('submit', async function (event) {
        event.preventDefault();
        const resultEl = document.getElementById('search-result');
        const chunksEl = document.getElementById('search-chunks');
        const query = document.getElementById('search-query').value.trim();
        chunksEl.innerHTML = '';

        try {
            const response = await fetch('/api/knowledge/search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: query })
            });

            if (response.status === 200) {
                const data = await response.json();
                if (data.results.length === 0) {
                    showResult(resultEl, 'success', '관련 결과가 없습니다.');
                } else {
                    showResult(resultEl, 'success', data.results.length + '개의 관련 청크를 찾았습니다.');
                    data.results.forEach(function (chunk) {
                        const div = document.createElement('div');
                        div.className = 'chunk';
                        div.innerHTML = '<div class="score">score: ' + chunk.score.toFixed(4) + '</div>' + chunk.content;
                        chunksEl.appendChild(div);
                    });
                }
            } else if (response.status === 400) {
                showResult(resultEl, 'error', '질의를 입력해주세요.');
            } else {
                showResult(resultEl, 'error', '검색에 실패했습니다. (HTTP ' + response.status + ')');
            }
        } catch (error) {
            showResult(resultEl, 'error', error.message);
        }
    });
</script>
</body>
</html>
