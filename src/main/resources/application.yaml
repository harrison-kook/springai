spring:
  application:
    name: springai
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/springai_rag}
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:mysecret}
    hikari:
      initialization-fail-timeout: -1
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  ai:
    model:
      chat: anthropic
      embedding: ollama
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: nomic-embed-text

knowledge:
  chunk-size: 500
  top-k: 5
